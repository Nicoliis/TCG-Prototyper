<template id="typed-inputs">
  <div class="typed-input-templates">
    <template class="line-input-template"><input type="text" class="typed-input"></template>
    <template class="text-input-template"><textarea class="typed-input" rows="4"></textarea></template>
    <template class="integer-input-template"><input type="text" inputmode="numeric" class="typed-input"></template>
    <template class="decimal-input-template"><input type="text" inputmode="decimal" class="typed-input"></template>
  </div>
</template>
