<template id="element-properties-panel">
  <div class="element-properties-panel">
    <h3>Element Properties</h3>
    <p class="element-properties-empty">Select an element on the canvas to edit it precisely.</p>

    <form class="element-properties-fields" hidden>
      <div class="tabs" role="tablist">
        <button type="button" class="tab-button" data-tab="content" aria-selected="true">Content</button>
        <button type="button" class="tab-button" data-tab="position">Position</button>
        <button type="button" class="tab-button" data-tab="text">Text</button>
        <button type="button" class="tab-button" data-tab="style">Style</button>
      </div>

      <div class="tab-panel" data-tab="content">
        <label class="prop-field">
          <span class="prop-field-label content-field-label">Name</span>
          <input type="text" name="name">
        </label>

        <label class="prop-field">
          <span class="prop-field-label content-field-label">Content</span>
          <input type="text" name="content">
        </label>

        <div class="sample-section">
          <span class="prop-field-label">Sample values</span>
          <div class="sample-value-fields"></div>
          <p class="content-preview">
            <output class="content-preview-value"></output>
          </p>
        </div>

        <template class="sample-value-field-template">
          <label class="prop-field sample-value-field">
            <span class="prop-field-label sample-value-field-name"></span>
            <input type="text" class="sample-value-field-input">
          </label>
        </template>
      </div>

      <div class="tab-panel" data-tab="position" hidden>
        <div class="prop-grid">
          <label class="prop-field"><span class="prop-field-label">X</span> <input type="number" name="x" step="1"></label>
          <label class="prop-field"><span class="prop-field-label">Y</span> <input type="number" name="y" step="1"></label>
          <label class="prop-field"><span class="prop-field-label">Width</span> <input type="number" name="width" min="1" step="1"></label>
          <label class="prop-field"><span class="prop-field-label">Height</span> <input type="number" name="height" min="1" step="1"></label>
        </div>
        <label class="prop-field">
          <span class="prop-field-label">Rotation (deg)</span>
          <input type="number" name="rotation" step="1">
        </label>
      </div>

      <div class="tab-panel" data-tab="text" hidden>
        <label class="prop-field">
          <span class="prop-field-label">Font</span>
          <select name="fontFamily">
            <option value="system-ui, sans-serif">Sans-serif</option>
            <option value="Georgia, 'Times New Roman', serif">Serif</option>
            <option value="'Courier New', monospace">Monospace</option>
            <option value="'Brush Script MT', cursive">Cursive</option>
          </select>
        </label>

        <div class="prop-grid">
          <label class="prop-field"><span class="prop-field-label">Size</span> <input type="number" name="fontSize" min="1" step="1"></label>
          <label class="prop-field prop-checkbox"><input type="checkbox" name="bold"> <span class="prop-field-label">Bold</span></label>
        </div>

        <fieldset class="segmented-field">
          <legend class="prop-field-label">Align</legend>
          <div class="segmented" data-field="align">
            <button type="button" data-value="left">Left</button>
            <button type="button" data-value="center">Center</button>
            <button type="button" data-value="right">Right</button>
          </div>
        </fieldset>

        <fieldset class="segmented-field">
          <legend class="prop-field-label">Vertical align</legend>
          <div class="segmented" data-field="verticalAlign">
            <button type="button" data-value="top">Top</button>
            <button type="button" data-value="middle">Middle</button>
            <button type="button" data-value="bottom">Bottom</button>
          </div>
        </fieldset>

        <fieldset class="segmented-field">
          <legend class="prop-field-label">Fit to box</legend>
          <div class="segmented" data-field="overflow">
            <button type="button" data-value="wrap">Wrap</button>
            <button type="button" data-value="shrink">Shrink</button>
            <button type="button" data-value="squash">Squash</button>
          </div>
        </fieldset>
      </div>

      <div class="tab-panel" data-tab="style" hidden>
        <fieldset class="style-group" data-style="background">
          <legend>
            <label class="prop-checkbox"><input type="checkbox" name="backgroundEnabled"> <span class="prop-field-label">Background</span></label>
          </legend>
          <label class="prop-field style-detail"><span class="prop-field-label">Color</span> <input type="color" name="backgroundColor"></label>
        </fieldset>

        <fieldset class="style-group" data-style="border">
          <legend>
            <label class="prop-checkbox"><input type="checkbox" name="borderEnabled"> <span class="prop-field-label">Border</span></label>
          </legend>
          <label class="prop-field style-detail"><span class="prop-field-label">Color</span> <input type="color" name="borderColor"></label>
          <label class="prop-field style-detail"><span class="prop-field-label">Thickness</span> <input type="number" name="borderThickness" min="1" step="1"></label>
        </fieldset>

        <fieldset class="style-group" data-style="shadow">
          <legend>
            <label class="prop-checkbox"><input type="checkbox" name="shadowEnabled"> <span class="prop-field-label">Shadow</span></label>
          </legend>
          <label class="prop-field style-detail"><span class="prop-field-label">Color</span> <input type="color" name="shadowColor"></label>
          <label class="prop-field style-detail"><span class="prop-field-label">Thickness</span> <input type="number" name="shadowThickness" min="1" step="1"></label>
        </fieldset>
      </div>
    </form>
  </div>
</template>
