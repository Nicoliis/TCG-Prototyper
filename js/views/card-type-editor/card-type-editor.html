<template id="card-type-editor-view">
  <section class="view card-type-editor-view">
    <button type="button" class="back-button">&larr; Card types</button>
    <h2 class="card-type-name-heading"></h2>

    <div class="editor-layout">
      <aside class="data-properties-panel">
        <div class="mode-switch" role="tablist">
          <button type="button" class="mode-button" data-mode="properties" aria-selected="true">Properties</button>
          <button type="button" class="mode-button" data-mode="design" aria-selected="false">Design</button>
        </div>

        <div class="mode-panel properties-area" data-mode="properties">
          <ul class="property-list property-list--builtin">
            <li class="property-list-item property-list-item--locked">
              <span class="property-name">ID</span>
              <span class="property-locked-note">Integer, assigned automatically</span>
            </li>
          </ul>
          <form class="add-property-form">
            <input type="text" name="propertyName" placeholder="Property name" required>
            <select name="propertyType" class="property-type-select" aria-label="Property type"></select>
            <button type="submit">Add property</button>
          </form>
          <p class="property-error field-error" hidden></p>
          <ul class="property-list"></ul>

          <template class="property-list-item-template">
            <li class="property-list-item">
              <span class="property-name"></span>
              <select class="property-type-select" aria-label="Property type"></select>
              <textarea class="property-sample-value-input" placeholder="Sample value" rows="2"></textarea>
              <button type="button" class="property-delete-button">Remove</button>
            </li>
          </template>
          <template class="property-type-option-template">
            <option></option>
          </template>
        </div>

        <div class="mode-panel design-area" data-mode="design" hidden>
        <div class="tabs" role="tablist">
          <button type="button" class="tab-button" data-tab="size" aria-selected="true">Size</button>
          <button type="button" class="tab-button" data-tab="add-element">Add Element</button>
          <button type="button" class="tab-button" data-tab="elements">Elements</button>
        </div>

        <div class="tab-panel" data-tab="size">
          <form class="dimensions-form">
            <label class="prop-field"><span class="prop-field-label">Width</span> <input type="number" name="width" min="1" required></label>
            <label class="prop-field"><span class="prop-field-label">Height</span> <input type="number" name="height" min="1" required></label>
            <button type="submit">Save size</button>
          </form>
          <p class="dimensions-error field-error" hidden></p>
        </div>

        <div class="tab-panel" data-tab="add-element" hidden>
          <div class="add-element-buttons">
            <button type="button" class="add-element-button" data-kind="text">Text display</button>
            <button type="button" class="add-element-button" data-kind="image">Image display</button>
            <button type="button" class="add-element-button" data-kind="label">Label</button>
            <button type="button" class="add-element-button" data-kind="icon">Image/Icon</button>
          </div>
        </div>

        <div class="tab-panel" data-tab="elements" hidden>
          <div class="layer-list-mount"></div>
        </div>
        </div>
      </aside>

      <div class="canvas-wrapper">
        <div class="canvas"></div>
      </div>

      <aside class="element-properties-panel-mount"></aside>
    </div>

    <template class="element-template" data-kind="text">
      <div class="layout-element layout-element--text">
        <div class="element-content"></div>
        <button type="button" class="element-delete-button" title="Delete">&times;</button>
        <div class="resize-handle" title="Drag to resize"></div>
        <div class="rotate-handle" title="Drag to rotate"></div>
      </div>
    </template>
    <template class="element-template" data-kind="image">
      <div class="layout-element layout-element--image">
        <img class="element-content" alt="">
        <button type="button" class="element-delete-button" title="Delete">&times;</button>
        <div class="resize-handle" title="Drag to resize"></div>
        <div class="rotate-handle" title="Drag to rotate"></div>
      </div>
    </template>
    <template class="element-template" data-kind="label">
      <div class="layout-element layout-element--label">
        <div class="element-content"></div>
        <button type="button" class="element-delete-button" title="Delete">&times;</button>
        <div class="resize-handle" title="Drag to resize"></div>
        <div class="rotate-handle" title="Drag to rotate"></div>
      </div>
    </template>
    <template class="element-template" data-kind="icon">
      <div class="layout-element layout-element--icon">
        <img class="element-content" alt="">
        <button type="button" class="element-delete-button" title="Delete">&times;</button>
        <div class="resize-handle" title="Drag to resize"></div>
        <div class="rotate-handle" title="Drag to rotate"></div>
      </div>
    </template>
  </section>
</template>
